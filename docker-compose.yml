# yachiyo: Authentik (self-hosted IdP) + Caddy (TLS edge), on its own VPS.
# Replaces Dex as the identity provider: self-service registration + email
# verification + password reset + social login (GitHub), all OIDC.
# Run ./setup.sh (after copying .env.example to .env) to generate secrets and
# render the Caddyfile, then: docker compose up -d
#
# Authentik listens on :9000 (HTTP); Caddy terminates TLS for ID_HOST and
# proxies to it. The server/worker share one env block (x-authentik-env). We do
# NOT mount the Docker socket: only OIDC is used, so no proxy/LDAP outposts.

x-authentik-env: &authentik-env
  AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
  AUTHENTIK_REDIS__HOST: redis
  AUTHENTIK_POSTGRESQL__HOST: postgresql
  AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
  AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
  AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
  # SMTP for verification/reset emails (Resend). Empty until configured in .env;
  # email features just won't send until then.
  AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL__HOST:-}
  AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL__PORT:-587}
  AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL__USERNAME:-}
  AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL__PASSWORD:-}
  AUTHENTIK_EMAIL__USE_TLS: ${AUTHENTIK_EMAIL__USE_TLS:-true}
  AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL__FROM:-}
  # GitHub OAuth app for sign-up/sign-in with GitHub, read by
  # authentik/blueprints/fleet-signup.yaml. Empty = no GitHub source.
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

services:
  postgresql:
    image: docker.io/library/postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      # Postgres 18+ keeps its data in a versioned subdirectory
      # (/var/lib/postgresql/18/docker) and refuses the old .../data layout.
      # A major upgrade is a dump and restore into a fresh volume (README).
      - postgresql:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_DB: ${PG_DB:-authentik}

  redis:
    image: docker.io/library/redis:8-alpine@sha256:5af80107c1eeecb484a2269b80a26d12bfa6521787da4663bd9f19f60a163483
    command: --save 60 1 --loglevel warning
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - redis:/data

  server:
    image: ghcr.io/goauthentik/server:2026.8.7@sha256:1675a017c46ba7f4f15333aeafeeb64538c581673bcbcd36af872cdf7de4e7f7   # Renovate PRs bump this; see README
    restart: unless-stopped
    command: server
    environment:
      <<: *authentik-env
    volumes:
      - media:/media
      - custom-templates:/templates
      - ./authentik/blueprints:/blueprints/custom:ro   # applied by Authentik itself
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: ghcr.io/goauthentik/server:2026.8.7@sha256:1675a017c46ba7f4f15333aeafeeb64538c581673bcbcd36af872cdf7de4e7f7   # Renovate PRs bump this; see README
    restart: unless-stopped
    command: worker
    environment:
      <<: *authentik-env
    volumes:
      - media:/media
      - custom-templates:/templates
      - ./authentik/blueprints:/blueprints/custom:ro   # applied by Authentik itself
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    restart: unless-stopped
    ports:
      - "80:80"      # ACME HTTP-01 + redirect
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro   # rendered by setup.sh
      - caddy-data:/data        # certificates live here — do not delete
      - caddy-config:/config
    depends_on:
      - server

volumes:
  postgresql:
  redis:
  media:
  custom-templates:
  caddy-data:
  caddy-config:
